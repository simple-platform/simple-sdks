name: Build and Release SDKs

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# SERIALISATION LIVES ON THE PUBLISH JOBS, NOT ON THE WORKFLOW.
#
# Two runs uploading to one registry at once race each other, so publishes have
# to queue — but only against publishes to the same registry. A group around the
# whole workflow makes every job wait behind every other job, and a publish waits
# on a human: the deployment review on each registry's environment can hold a run
# for as long as it takes someone to read the changelog. One sat for 6h11m, and
# the next push spent 30 minutes of that queued behind it with nothing to do but
# compute a version and run a build that had no bearing on the release ahead.
#
# So each publish job carries its own `concurrency` block. Everything else in
# this file — versioning, building, linting, the gate — is free to run whenever
# it is pushed, because none of it touches a registry.

permissions:
  contents: read

jobs:
  # THE NEWEST PUSH IS THE ONE THAT WAITS FOR APPROVAL.
  #
  # Every lane computes its version from its own tags, so a run on a newer
  # commit offers each release an older run was holding, built from a tree that
  # contains it. From that moment the older offer is redundant, and this job
  # withdraws it: every older run of this workflow on `main` that is still open
  # is cancelled when a newer push starts its own.
  #
  # ONE KIND OF RUN IS LEFT ALONE: one that is publishing. A publish starts only
  # once the review on its environment is approved, so a run with no approval
  # has uploaded nothing and is cancelled whatever it is doing — versioning,
  # building or waiting. A run that holds an approval is cancelled only when
  # none of its jobs is under way: an upload that has begun is left to finish.
  #
  # No checkout and no third-party action. The job reads and cancels runs
  # through the API with its own token, and it is the only job in this file
  # that holds `actions: write`.
  supersede:
    name: Withdraw Superseded Runs
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Cancel the older runs that are still open
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # The workflow is named by the file this run was started from, so the
          # name is not written down a second time here.
          workflow="${GITHUB_WORKFLOW_REF%@*}"
          workflow="${workflow##*/}"

          older=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?branch=main&event=push&per_page=100" \
            --jq ".workflow_runs[] | select(.status != \"completed\" and .run_number < ${GITHUB_RUN_NUMBER}) | .id")

          if [ -z "$older" ]; then
            echo "No older run is open." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          for id in $older; do
            approved=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/approvals" \
              --jq '[.[] | select(.state == "approved")] | length')

            if [ "$approved" -gt 0 ]; then
              under_way=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/jobs?per_page=100" \
                --jq '[.jobs[] | select(.status != "completed" and .status != "waiting")] | length')

              if [ "$under_way" -gt 0 ]; then
                echo "Run ${id} is publishing an approved release. It is left to finish." >> "$GITHUB_STEP_SUMMARY"
                continue
              fi
            fi

            if gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/cancel" > /dev/null; then
              echo "Run ${id} is cancelled. This run offers its releases from a newer commit." >> "$GITHUB_STEP_SUMMARY"
            elif [ "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${id}" --jq .status)" = "completed" ]; then
              echo "Run ${id} finished before it was cancelled." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "Run ${id} is still open and was not cancelled." >&2
              exit 1
            fi
          done

  version:
    name: Calculate Versions
    runs-on: ubuntu-latest
    outputs:
      ts-version: ${{ steps.ts-version.outputs.version }}
      ts-version-tag: ${{ steps.ts-version.outputs.version_tag }}
      ts-changed: ${{ steps.ts-version.outputs.changed }}
      rust-version: ${{ steps.rust-version.outputs.version }}
      rust-version-tag: ${{ steps.rust-version.outputs.version_tag }}
      rust-changed: ${{ steps.rust-version.outputs.changed }}
      kit-version: ${{ steps.kit-version.outputs.version }}
      kit-version-tag: ${{ steps.kit-version.outputs.version_tag }}
      kit-changed: ${{ steps.kit-version.outputs.changed }}
      rust-toolchain: ${{ steps.rust-toolchain.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      # THIS PACKAGE IS PAST 1.0, SO THE MAJOR IS ITS INCOMPATIBILITY BOUNDARY.
      #
      # Above one, `^1.2` never moves onto `2.0` by itself, so cutting a major
      # tells every installed caller that their next `pnpm update` stops here
      # until they have done the migration. When that happens is a judgement
      # about timing and about the note that ships alongside it, and the diff
      # cannot make it: a break can land on `main` well ahead of the release that
      # carries it, and it can be taken back off again. Both have happened here.
      #
      # So a major is written out in full and cannot be typed by accident. Until
      # someone writes that sentence, this lane cuts patches and minors. A `!`
      # still records the break where a reader looks for it — in `git log`, and
      # under Breaking Changes in the changelog step below — but recording a
      # break and choosing the release that carries it are two different acts,
      # and only the second one ends in an upload.
      #
      # `search_commit_body` is OFF for this lane, and that is what makes the
      # sentence above safe to write down. With bodies searched it would be
      # enough to QUOTE the policy — in a commit explaining it, or a README edit
      # pasting it — to compute a major from a change that declared nothing. The
      # subject line is the one place a release is deliberate, so this lane reads
      # only that. The Rust step below turns it off for the same reason.
      #
      # TWO SCOPES ARE THIS LANE'S. The Space SDK ships inside this package
      # (`sdks/ts/src/space`), and its commits carry the scope `sdk-space`. Read
      # as `sdk-ts` alone, a Space SDK feature counted as a patch and was left
      # out of the changelog below: every one after 2.5.0 would have shipped
      # that way. A `feat` under either scope is a minor and both are listed. A
      # major is still only the sentence above, under `sdk-ts`.
      - name: TypeScript SDK Version
        id: ts-version
        uses: paulhatch/semantic-version@9f72830310d5ed81233b641ee59253644cd8a8fc # v6.0.2
        with:
          tag_prefix: v
          major_pattern: '/\(sdk-ts\)!?: release the next major/'
          minor_pattern: '/feat\((sdk-ts|sdk-space)\):/'
          version_format: '${major}.${minor}.${patch}'
          change_path: sdks/ts
          namespace: ts
          bump_each_commit: false
          search_commit_body: false
          enable_prerelease_mode: false
          debug: false

      - name: Display Debug Output
        if: steps.ts-version.outputs.debug_output
        run: |
          echo "${{ steps.ts-version.outputs.debug_output }}"

      # WHAT STARTS A RELEASE. This workflow runs on pushes to `main` and on pull
      # requests against `main` — see `on:` at the top of this file. Tags are an
      # output of it and never an input.
      #
      #   * `namespace` keeps the two version histories apart: this step reads
      #     back only `v<version>-rust` tags and the TypeScript step only
      #     `v<version>-ts`, so each lane is versioned by its own releases.
      #   * `change_path` is the path a lane's version is computed over. The
      #     action compares the newest tag in its own namespace against `HEAD`
      #     for that path, so `changed` means "this path holds commits that have
      #     not been released yet" — whichever run picks them up, the version
      #     published is the one those commits earned.
      #
      # WHILE THIS CRATE IS 0.x, A BREAKING CHANGE BUMPS THE MINOR.
      #
      # Cargo does not treat 0.x as an unfinished 1.0: below one, the MINOR is
      # the incompatibility boundary, so `0.1` and `0.2` are different versions
      # to a caller and `^0.1` never moves onto `0.2` by itself. The minor
      # therefore already carries, before 1.0, exactly what the major carries
      # after it.
      #
      # So `!` is read as a minor bump here, alongside `feat`. Left as a major
      # bump it would take the first deliberate break from 0.1.0 straight to
      # 1.0.0 — declaring the API stable as a side effect of a punctuation mark,
      # which is the one thing 0.x exists to avoid saying.
      #
      # Reaching 1.0.0 is a judgement that the surface is worth committing to,
      # so it is written out in full and cannot be typed by accident. Until
      # someone writes that sentence, this lane stays in 0.x.
      #
      # `search_commit_body` is OFF for this lane, and that is what makes the
      # sentence above safe to write down. Searched bodies, it would be enough to
      # QUOTE the policy — in a commit explaining it, or a README edit pasting it
      # — to compute 1.0.0 from a change that declared nothing. The subject line
      # is the one place a release is deliberate, so this lane reads only that.
      - name: Rust SDK Version
        id: rust-version
        uses: paulhatch/semantic-version@9f72830310d5ed81233b641ee59253644cd8a8fc # v6.0.2
        with:
          tag_prefix: v
          major_pattern: '/\(sdk-rust\) declares the API stable/'
          minor_pattern: '/(feat\(sdk-rust\):)|(\(sdk-rust\)!:)/'
          version_format: '${major}.${minor}.${patch}'
          change_path: sdks/rust
          namespace: rust
          bump_each_commit: false
          search_commit_body: false
          enable_prerelease_mode: false
          debug: false

      - name: Display Rust Debug Output
        if: steps.rust-version.outputs.debug_output
        run: |
          echo "${{ steps.rust-version.outputs.debug_output }}"

      # THE UI KIT IS 0.x, AND IS VERSIONED THE WAY THE CRATE IS.
      #
      # `@simpleplatform/ui-kit` lives in `sdks/space-ui` and its commits carry
      # the scope `sdk-ui`. It is below 1.0, so a `!` is a minor here for the
      # reason the Rust step above gives, and 1.0.0 is cut only by the sentence
      # written out in full. `search_commit_body` is off for the same reason
      # too. Its tags are `v<version>-kit`, read back by this step alone.
      - name: UI Kit Version
        id: kit-version
        uses: paulhatch/semantic-version@9f72830310d5ed81233b641ee59253644cd8a8fc # v6.0.2
        with:
          tag_prefix: v
          major_pattern: '/\(sdk-ui\) declares the API stable/'
          minor_pattern: '/(feat\(sdk-ui\):)|(\(sdk-ui\)!:)/'
          version_format: '${major}.${minor}.${patch}'
          change_path: sdks/space-ui
          namespace: kit
          bump_each_commit: false
          search_commit_body: false
          enable_prerelease_mode: false
          debug: false

      - name: Display UI Kit Debug Output
        if: steps.kit-version.outputs.debug_output
        run: |
          echo "${{ steps.kit-version.outputs.debug_output }}"

      # The Rust toolchain has exactly one authority in this repository and it is
      # devbox.json, the same file a contributor's toolchain comes from. Read, not
      # copied: a number written down twice is a number that drifts.
      - name: Rust Toolchain Version
        id: rust-toolchain
        run: |
          set -euo pipefail
          version=$(jq -r '.env.RUST_VERSION // empty' devbox.json)
          if [ -z "$version" ]; then
            echo "devbox.json has no .env.RUST_VERSION. It is the only authority for the Rust version; if it moved, move this read with it." >&2
            exit 1
          fi
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "devbox.json .env.RUST_VERSION is '$version', which is not a toolchain version" >&2
              exit 1
              ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build-typescript:
    name: Build TypeScript SDK
    needs: version
    if: needs.version.outputs.ts-changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      # Pinned by commit, like every other action in this file. `@v3` is a branch
      # in that repository rather than a tag, so it is a name that can be moved
      # over a different tree without the reference here changing; the trailing
      # comment records the released tag the pinned commit carries.
      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0
        with:
          version: 10.32.1

      # pnpm is on PATH by the time this runs, so `cache: pnpm` can ask it where
      # its store lives. Naming the cache explicitly also settles which package
      # manager is cached: from v5 this action reads package.json's
      # `packageManager` field when no `cache` is given, and an explicit value
      # takes precedence over that.
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '25'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm lint

      - name: Build TypeScript SDK
        run: |
          cd sdks/ts
          pnpm build

      - name: Generate Changelog
        if: github.ref == 'refs/heads/main' && !github.event.pull_request
        run: |
          # Get the previous tag for this SDK
          PREV_TAG=$(git tag -l "v*-ts" --sort=-version:refname | head -n 1)

          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --pretty=format:"* %s (%h)" --grep="(sdk-ts)" --grep="(sdk-space)" -- sdks/ts)
          else
            COMMITS=$(git log ${PREV_TAG}..HEAD --pretty=format:"* %s (%h)" --grep="(sdk-ts)" --grep="(sdk-space)" -- sdks/ts)
          fi

          # Organize commits by type. Both of this lane's scopes are read (see
          # the version step), and a breaking commit is listed under Breaking
          # Changes only, not a second time under Other Changes.
          FEATURES=$(echo "$COMMITS" | grep -E "feat\((sdk-ts|sdk-space)\):" || true)
          FIXES=$(echo "$COMMITS" | grep -E "fix\((sdk-ts|sdk-space)\):" || true)
          BREAKING=$(echo "$COMMITS" | grep -E "(feat|fix)\((sdk-ts|sdk-space)\)!:|BREAKING CHANGE" || true)
          OTHER=$(echo "$COMMITS" | grep -v -E "(feat|fix)\((sdk-ts|sdk-space)\)!?:" || true)

          # Build changelog
          echo "## TypeScript SDK ${{ needs.version.outputs.ts-version }}" > changelog.md
          echo "" >> changelog.md

          if [ -n "$BREAKING" ]; then
            echo "### ⚠️ Breaking Changes" >> changelog.md
            echo "$BREAKING" >> changelog.md
            echo "" >> changelog.md
          fi

          if [ -n "$FEATURES" ]; then
            echo "### ✨ Features" >> changelog.md
            echo "$FEATURES" >> changelog.md
            echo "" >> changelog.md
          fi

          if [ -n "$FIXES" ]; then
            echo "### 🐛 Bug Fixes" >> changelog.md
            echo "$FIXES" >> changelog.md
            echo "" >> changelog.md
          fi

          if [ -n "$OTHER" ]; then
            echo "### 📝 Other Changes" >> changelog.md
            echo "$OTHER" >> changelog.md
            echo "" >> changelog.md
          fi

          echo "### 📦 Installation" >> changelog.md
          echo "\`\`\`bash" >> changelog.md
          echo "pnpm add @simpleplatform/sdk@${{ needs.version.outputs.ts-version }}" >> changelog.md
          echo "\`\`\`" >> changelog.md

      - name: Upload changelog
        if: github.ref == 'refs/heads/main' && !github.event.pull_request
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: changelog
          path: changelog.md
          retention-days: 5

      - name: Upload build
        if: github.ref == 'refs/heads/main' && !github.event.pull_request
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ts-sdk
          path: sdks/ts/dist
          retention-days: 5

      - name: Create Release Summary
        if: github.ref == 'refs/heads/main' && !github.event.pull_request
        run: |
          echo "## 📋 Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ needs.version.outputs.ts-version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** ${{ needs.version.outputs.ts-version-tag }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Changelog Preview" >> $GITHUB_STEP_SUMMARY
          cat changelog.md >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "**⚠️ Review the changelog above before approving the deployment**" >> $GITHUB_STEP_SUMMARY

  publish-typescript:
    name: Publish TypeScript SDK
    needs: [version, build-typescript]
    if: needs.version.outputs.ts-changed == 'true' && github.ref == 'refs/heads/main' && !github.event.pull_request
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # ONE ENVIRONMENT PER REGISTRY, NOT ONE PER RELEASE.
    #
    # A deployment review is granted to an ENVIRONMENT, not to a job, so two
    # lanes sharing one environment are approved by one click: releasing the
    # crate would have released the package beside it. Naming the environment
    # after the registry it publishes to keeps each approval about one artifact,
    # and gives each registry's token an environment of its own to live in.
    #
    # A language added later takes its own — a Go SDK does not publish to a
    # registry at all, and a Python one would take `pypi.org`.
    #
    # The UI Kit is the one job that shares an environment. It is a second
    # package on this registry, published with this registry's token, so
    # `publish-ui-kit` below names `npmjs.org` too. On a run where both packages
    # changed, one approval therefore releases both. They are reviewed together
    # because they are used together: a kit that needs a new SDK call ships with
    # the SDK that has it.
    environment:
      name: npmjs.org
      url: https://www.npmjs.com/package/@simpleplatform/sdk/v/${{ needs.version.outputs.ts-version }}
    # One upload to npm at a time, and nothing else waits on it. The group names
    # the registry and nothing else — the SDK and the UI Kit both upload to it,
    # one after the other, and only `main` reaches these jobs, so the registry is
    # the whole of what has to queue.
    # In-progress runs are not cancelled: a run that has already uploaded to a
    # registry cannot be undone by stopping it.
    concurrency:
      group: publish-npmjs.org
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      # `package-manager-cache: false` because pnpm is not on PATH yet — the
      # Corepack step below is what puts it there. From v5 this action caches for
      # the package manager named in package.json's `packageManager` field unless
      # it is told not to, and caching pnpm means asking pnpm where its store is.
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '25'
          package-manager-cache: false

      # A RUN CAN BE ASKED TO PUBLISH A VERSION THAT IS ALREADY OUT.
      #
      # Every push to `main` computes the version its unreleased commits have
      # earned, so two pushes ahead of one release compute the same number, and
      # the second run still waits for its approval after the first has
      # published. The registry refuses a version it holds, which made that
      # second approval a failed run with nothing wrong behind it.
      #
      # So the registry and the tag are asked first: a version the registry
      # holds is not uploaded again, and a tag that exists is not released
      # again. They are asked separately because they are written separately. A
      # run that uploaded and then stopped leaves a version with no tag, and
      # without its tag this lane would compute that same version for every
      # later commit; the release step still runs then, and finishes it.
      #
      # A registry that cannot be reached reads as "not published". The upload
      # is then attempted, and the registry itself is the judge of it.
      - name: Check what is already released
        id: released
        env:
          VERSION: ${{ needs.version.outputs.ts-version }}
          TAG: ${{ needs.version.outputs.ts-version-tag }}
        run: |
          if [ "$(npm view "@simpleplatform/sdk@${VERSION}" version 2>/dev/null)" = "$VERSION" ]; then
            echo "on-registry=true" >> "$GITHUB_OUTPUT"
            echo "@simpleplatform/sdk ${VERSION} is already on npm. It is not uploaded again." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "on-registry=false" >> "$GITHUB_OUTPUT"
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "tagged=true" >> "$GITHUB_OUTPUT"
            echo "The tag ${TAG} exists. No release is created again." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "tagged=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Enable Corepack
        if: steps.released.outputs.on-registry != 'true'
        run: corepack enable

      - name: Install dependencies
        if: steps.released.outputs.on-registry != 'true'
        run: pnpm install

      - name: Download changelog
        if: steps.released.outputs.tagged != 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: changelog

      # THE VERSION OF RECORD IS THE TAG AND THE REGISTRY.
      #
      # `sdks/ts/package.json` carries `0.0.0` in the repository — a number no
      # release has ever had — and this step writes the computed one into the
      # checkout that is about to be packed, so the published package carries it.
      # Nothing commits that edit back. `main` is protected, so the only ways to
      # land it are to open the branch or to hand a release job a credential that
      # bypasses the protection, and what either would buy is a second copy of
      # what the `v<version>-ts` tag and the npm registry already say.
      #
      # The release notes go the same way: the GitHub Release at the end of this
      # job carries the changelog this run generated, so there is no CHANGELOG.md
      # in the tree that could fall out of step with what was actually published.
      - name: Update package version
        if: steps.released.outputs.on-registry != 'true'
        run: |
          cd sdks/ts
          pnpm version ${{ needs.version.outputs.ts-version }} --no-git-tag-version

      - name: Publish to npm
        if: steps.released.outputs.on-registry != 'true'
        run: |
          cd sdks/ts
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > .npmrc
          pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # THE TAG NAMES THE COMMIT THIS RUN BUILT.
      #
      # A publish waits on a review, and `main` moves while it waits. Naming the
      # commit here puts the tag on the tree the package was built from, so the
      # tag, the registry and the changelog describe one commit, and the next
      # version is computed over exactly what came after it.
      - name: Create GitHub Release
        if: steps.released.outputs.tagged != 'true'
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          tag_name: ${{ needs.version.outputs.ts-version-tag }}
          target_commitish: ${{ github.sha }}
          name: TypeScript SDK ${{ needs.version.outputs.ts-version }}
          body_path: changelog.md
          draft: false
          prerelease: ${{ contains(needs.version.outputs.ts-version, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-ui-kit:
    name: Build UI Kit
    needs: version
    if: needs.version.outputs.kit-changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '25'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm lint

      # The kit is typed against the SDK of this workspace, which an install
      # does not build, so the SDK is built first.
      - name: Build TypeScript SDK
        run: |
          cd sdks/ts
          pnpm build

      # `pnpm test` builds the kit and then runs its tests, as the crate's job
      # runs `cargo test`: what is published has been built and tested here.
      - name: Build and test UI Kit
        run: |
          cd sdks/space-ui
          pnpm test

      - name: Generate Changelog
        if: github.ref == 'refs/heads/main' && !github.event.pull_request
        run: |
          # Get the previous tag for this package
          PREV_TAG=$(git tag -l "v*-kit" --sort=-version:refname | head -n 1)

          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --pretty=format:"* %s (%h)" --grep="(sdk-ui)" -- sdks/space-ui)
          else
            COMMITS=$(git log ${PREV_TAG}..HEAD --pretty=format:"* %s (%h)" --grep="(sdk-ui)" -- sdks/space-ui)
          fi

          # Organize commits by type
          FEATURES=$(echo "$COMMITS" | grep "feat(sdk-ui):" || true)
          FIXES=$(echo "$COMMITS" | grep "fix(sdk-ui):" || true)
          BREAKING=$(echo "$COMMITS" | grep -E "(feat|fix)\(sdk-ui\)!:" || true)
          OTHER=$(echo "$COMMITS" | grep -v -E "(feat|fix)\(sdk-ui\)!?:" || true)

          # Build changelog
          echo "## UI Kit ${{ needs.version.outputs.kit-version }}" > kit-changelog.md
          echo "" >> kit-changelog.md

          if [ -n "$BREAKING" ]; then
            echo "### ⚠️ Breaking Changes" >> kit-changelog.md
            echo "$BREAKING" >> kit-changelog.md
            echo "" >> kit-changelog.md
          fi

          if [ -n "$FEATURES" ]; then
            echo "### ✨ Features" >> kit-changelog.md
            echo "$FEATURES" >> kit-changelog.md
            echo "" >> kit-changelog.md
          fi

          if [ -n "$FIXES" ]; then
            echo "### 🐛 Bug Fixes" >> kit-changelog.md
            echo "$FIXES" >> kit-changelog.md
            echo "" >> kit-changelog.md
          fi

          if [ -n "$OTHER" ]; then
            echo "### 📝 Other Changes" >> kit-changelog.md
            echo "$OTHER" >> kit-changelog.md
            echo "" >> kit-changelog.md
          fi

          echo "### 📦 Installation" >> kit-changelog.md
          echo "\`\`\`bash" >> kit-changelog.md
          echo "pnpm add @simpleplatform/ui-kit@${{ needs.version.outputs.kit-version }}" >> kit-changelog.md
          echo "\`\`\`" >> kit-changelog.md

      - name: Upload changelog
        if: github.ref == 'refs/heads/main' && !github.event.pull_request
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: kit-changelog
          path: kit-changelog.md
          retention-days: 5

      - name: Upload build
        if: github.ref == 'refs/heads/main' && !github.event.pull_request
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ui-kit
          path: sdks/space-ui/dist
          retention-days: 5

      - name: Create Release Summary
        if: github.ref == 'refs/heads/main' && !github.event.pull_request
        run: |
          echo "## 📋 UI Kit Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ needs.version.outputs.kit-version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** ${{ needs.version.outputs.kit-version-tag }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Changelog Preview" >> $GITHUB_STEP_SUMMARY
          cat kit-changelog.md >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "**⚠️ Review the changelog above before approving the deployment**" >> $GITHUB_STEP_SUMMARY

  publish-ui-kit:
    name: Publish UI Kit
    needs: [version, build-ui-kit]
    if: needs.version.outputs.kit-changed == 'true' && github.ref == 'refs/heads/main' && !github.event.pull_request
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # The same environment and the same queue as `publish-typescript`: this is
    # the second package on npm and it is published with npm's token. The note
    # on that job says what sharing the environment means for an approval.
    environment:
      name: npmjs.org
      url: https://www.npmjs.com/package/@simpleplatform/ui-kit/v/${{ needs.version.outputs.kit-version }}
    concurrency:
      group: publish-npmjs.org
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '25'
          package-manager-cache: false

      # Asked first, for the reason given on `publish-typescript`: a version npm
      # holds is not uploaded again, and a tag that exists is not released again.
      - name: Check what is already released
        id: released
        env:
          VERSION: ${{ needs.version.outputs.kit-version }}
          TAG: ${{ needs.version.outputs.kit-version-tag }}
        run: |
          if [ "$(npm view "@simpleplatform/ui-kit@${VERSION}" version 2>/dev/null)" = "$VERSION" ]; then
            echo "on-registry=true" >> "$GITHUB_OUTPUT"
            echo "@simpleplatform/ui-kit ${VERSION} is already on npm. It is not uploaded again." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "on-registry=false" >> "$GITHUB_OUTPUT"
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "tagged=true" >> "$GITHUB_OUTPUT"
            echo "The tag ${TAG} exists. No release is created again." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "tagged=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Enable Corepack
        if: steps.released.outputs.on-registry != 'true'
        run: corepack enable

      - name: Install dependencies
        if: steps.released.outputs.on-registry != 'true'
        run: pnpm install

      - name: Download changelog
        if: steps.released.outputs.tagged != 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: kit-changelog

      # Nothing has built the kit in this checkout: it has no `prepare` script.
      # It is typed against the SDK of this workspace, so that is built first.
      - name: Build TypeScript SDK
        if: steps.released.outputs.on-registry != 'true'
        run: |
          cd sdks/ts
          pnpm build

      - name: Build UI Kit
        if: steps.released.outputs.on-registry != 'true'
        run: |
          cd sdks/space-ui
          pnpm build

      # The version of record is the tag and the registry, as for the SDK: the
      # number in `sdks/space-ui/package.json` is not what is published.
      - name: Update package version
        if: steps.released.outputs.on-registry != 'true'
        run: |
          cd sdks/space-ui
          pnpm version ${{ needs.version.outputs.kit-version }} --no-git-tag-version

      - name: Publish to npm
        if: steps.released.outputs.on-registry != 'true'
        run: |
          cd sdks/space-ui
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > .npmrc
          pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The tag names the commit this run built, for the reason given on
      # `publish-typescript`.
      - name: Create GitHub Release
        if: steps.released.outputs.tagged != 'true'
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          tag_name: ${{ needs.version.outputs.kit-version-tag }}
          target_commitish: ${{ github.sha }}
          name: UI Kit ${{ needs.version.outputs.kit-version }}
          body_path: kit-changelog.md
          draft: false
          prerelease: ${{ contains(needs.version.outputs.kit-version, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-rust:
    name: Build Rust SDK
    needs: version
    if: needs.version.outputs.rust-changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Set up Rust
        env:
          RUST_VERSION: ${{ needs.version.outputs.rust-toolchain }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_VERSION"
          rustup target add wasm32-wasip1
          rustc --version

      # The release path gates itself rather than trusting that rust-sdk-test.yml
      # ran, the same way build-typescript runs `pnpm lint` rather than trusting
      # that something else linted. The two overlap on a pull request that touches
      # sdks/rust; that is the intended cost.
      - name: Gate
        working-directory: sdks/rust
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo clippy --all-targets --features async -- -D warnings
          cargo test

      # Both wasm builds, because the two feature configurations declare
      # different import sets and each one ships to a host that binds its own.
      #
      # `--examples` links the library into binaries, and a binary is what emits
      # a `.wasm` module with an import section — the same way an action links
      # the crate in production.
      #
      # What ships from this lane is the source, so `cargo package` is its
      # artifact: it builds the crate tarball exactly as `cargo publish` will.
      - name: Build Rust SDK
        working-directory: sdks/rust
        run: |
          cargo build --target wasm32-wasip1 --release --examples
          cargo build --target wasm32-wasip1 --release --features async --examples
          cargo package

      - name: Generate Changelog
        if: github.ref == 'refs/heads/main' && !github.event.pull_request
        run: |
          # Get the previous tag for this SDK
          PREV_TAG=$(git tag -l "v*-rust" --sort=-version:refname | head -n 1)

          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --pretty=format:"* %s (%h)" --grep="(sdk-rust)" -- sdks/rust)
          else
            COMMITS=$(git log ${PREV_TAG}..HEAD --pretty=format:"* %s (%h)" --grep="(sdk-rust)" -- sdks/rust)
          fi

          # Organize commits by type
          FEATURES=$(echo "$COMMITS" | grep "feat(sdk-rust):" || true)
          FIXES=$(echo "$COMMITS" | grep "fix(sdk-rust):" || true)
          BREAKING=$(echo "$COMMITS" | grep -E "(feat|fix)\(sdk-rust\)!:" || true)
          OTHER=$(echo "$COMMITS" | grep -v -E "feat\(sdk-rust\):|fix\(sdk-rust\):" || true)

          # Build changelog
          echo "## Rust SDK ${{ needs.version.outputs.rust-version }}" > rust-changelog.md
          echo "" >> rust-changelog.md

          if [ -n "$BREAKING" ]; then
            echo "### ⚠️ Breaking Changes" >> rust-changelog.md
            echo "$BREAKING" >> rust-changelog.md
            echo "" >> rust-changelog.md
          fi

          if [ -n "$FEATURES" ]; then
            echo "### ✨ Features" >> rust-changelog.md
            echo "$FEATURES" >> rust-changelog.md
            echo "" >> rust-changelog.md
          fi

          if [ -n "$FIXES" ]; then
            echo "### 🐛 Bug Fixes" >> rust-changelog.md
            echo "$FIXES" >> rust-changelog.md
            echo "" >> rust-changelog.md
          fi

          if [ -n "$OTHER" ]; then
            echo "### 📝 Other Changes" >> rust-changelog.md
            echo "$OTHER" >> rust-changelog.md
            echo "" >> rust-changelog.md
          fi

          echo "### 📦 Installation" >> rust-changelog.md
          echo "\`\`\`bash" >> rust-changelog.md
          echo "cargo add simpleplatform-sdk@${{ needs.version.outputs.rust-version }}" >> rust-changelog.md
          echo "\`\`\`" >> rust-changelog.md

      # Artifact names are per lane, because both lanes can run in the same
      # workflow run and each carries its own release notes through to publish.
      - name: Upload changelog
        if: github.ref == 'refs/heads/main' && !github.event.pull_request
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: rust-changelog
          path: rust-changelog.md
          retention-days: 5

      - name: Upload build
        if: github.ref == 'refs/heads/main' && !github.event.pull_request
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: rust-sdk
          path: sdks/rust/target/package/*.crate
          retention-days: 5

      - name: Create Release Summary
        if: github.ref == 'refs/heads/main' && !github.event.pull_request
        run: |
          echo "## 📋 Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Crate:** simpleplatform-sdk" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ needs.version.outputs.rust-version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** ${{ needs.version.outputs.rust-version-tag }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Changelog Preview" >> $GITHUB_STEP_SUMMARY
          cat rust-changelog.md >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "**⚠️ Review the changelog above before approving the deployment**" >> $GITHUB_STEP_SUMMARY

  publish-rust:
    name: Publish Rust SDK
    needs: [version, build-rust]
    if: needs.version.outputs.rust-changed == 'true' && github.ref == 'refs/heads/main' && !github.event.pull_request
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Its own environment, so approving a crate release approves exactly that.
    # See the note on the TypeScript lane above.
    environment:
      name: crates.io
      url: https://crates.io/crates/simpleplatform-sdk/${{ needs.version.outputs.rust-version }}
    # Its own group, so a crate release queues behind crate releases and behind
    # nothing else. See the note on the TypeScript lane above.
    concurrency:
      group: publish-crates.io
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      # Asked first, for the reason given on `publish-typescript`.
      #
      # One `cargo publish` uploads both crates, so the upload is skipped only
      # when crates.io holds this version of both. One without the other is a
      # release that stopped half way; it is left to run and fail where it can
      # be seen, because nothing here can finish it safely.
      - name: Check what is already released
        id: released
        env:
          VERSION: ${{ needs.version.outputs.rust-version }}
          TAG: ${{ needs.version.outputs.rust-version-tag }}
        run: |
          held=0
          for crate in simpleplatform-sdk-macros simpleplatform-sdk; do
            if curl --fail --silent --output /dev/null \
              --user-agent "simple-sdks release workflow (https://github.com/simple-platform/simple-sdks)" \
              "https://crates.io/api/v1/crates/${crate}/${VERSION}"; then
              held=$((held + 1))
            fi
          done

          if [ "$held" -eq 2 ]; then
            echo "on-registry=true" >> "$GITHUB_OUTPUT"
            echo "simpleplatform-sdk ${VERSION} and its derive are already on crates.io. They are not uploaded again." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "on-registry=false" >> "$GITHUB_OUTPUT"
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "tagged=true" >> "$GITHUB_OUTPUT"
            echo "The tag ${TAG} exists. No release is created again." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "tagged=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Rust
        if: steps.released.outputs.on-registry != 'true'
        env:
          RUST_VERSION: ${{ needs.version.outputs.rust-toolchain }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          rustup target add wasm32-wasip1
          rustc --version

      - name: Download changelog
        if: steps.released.outputs.tagged != 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: rust-changelog

      # THE VERSION OF RECORD IS THE TAG AND THE REGISTRY.
      #
      # Both manifests carry `0.0.0` in the repository — a number no release has
      # ever had — and this step writes the computed one into the checkout that
      # cargo is about to package, so the published crates carry it. Nothing
      # commits that edit back; see the note on the TypeScript lane above for
      # why, and for where the release notes live instead.
      #
      # `sed` rather than a helper: cargo has no counterpart to `pnpm version`,
      # and cargo-edit's `cargo set-version` would mean a from-source install on
      # every release. The substitution is anchored to the start of a line, which
      # in this manifest is the [package] version alone — a dependency's version
      # sits inside braces on its own line. The count is asserted first, so the
      # step rewrites exactly the one line it means to.
      - name: Update crate version
        if: steps.released.outputs.on-registry != 'true'
        working-directory: sdks/rust
        run: |
          set -euo pipefail
          VERSION="${{ needs.version.outputs.rust-version }}"

          # `|| true` hands the count to the check below in every case: grep
          # exits 1 when it counts zero, and `set -e` would otherwise end the
          # step before the message can report the number it found.
          # BOTH CRATES MOVE TOGETHER. The derive is published from this lane as
          # well, and the SDK names it by version, so a release that versioned
          # only one of them would upload a crate whose dependency does not
          # exist at the version it asks for.
          for manifest in Cargo.toml macros/Cargo.toml; do
            MATCHES=$(grep -c '^version = ".*"$' "$manifest" || true)
            if [ "$MATCHES" -ne 1 ]; then
              echo "expected exactly one package version line in $manifest, found $MATCHES" >&2
              exit 1
            fi

            sed -E 's/^version = ".*"$/version = "'"$VERSION"'"/' "$manifest" > "$manifest.next"
            mv "$manifest.next" "$manifest"
          done

          # And the line that names it, which is what crates.io resolves against.
          DEPS=$(grep -c '^simpleplatform-sdk-macros = ' Cargo.toml || true)
          if [ "$DEPS" -ne 1 ]; then
            echo "expected exactly one simpleplatform-sdk-macros dependency line, found $DEPS" >&2
            exit 1
          fi

          sed -E 's/^(simpleplatform-sdk-macros = \{ version = ")[^"]*(".*)$/\1'"$VERSION"'\2/' \
            Cargo.toml > Cargo.toml.next
          mv Cargo.toml.next Cargo.toml

          # Cargo.lock carries each crate's own version too, and cargo refuses to
          # publish against a stale lock. This resolves online: `--workspace`
          # re-resolves every member's graph, which a cold registry cache cannot
          # do offline, and this job has no cache and no prior build.
          cargo update --workspace

          grep '^version = ' Cargo.toml macros/Cargo.toml
          grep '^simpleplatform-sdk-macros = ' Cargo.toml

      # --allow-dirty because the step above deliberately edited Cargo.toml in the
      # checkout; that edit is the release. cargo still runs its own verification
      # build of the packaged tarball, from its extracted form, before uploading.
      # ONE INVOCATION PUBLISHES BOTH CRATES, and must not be split into two.
      #
      # `default-members` selects the SDK and the derive, and cargo publishes a
      # selection in dependency order, waiting for the registry index to carry
      # each one before it uploads what depends on it. Publishing the derive in a
      # step of its own does not help the order — it is already right — and makes
      # this step fail, because cargo refuses a version the registry already
      # holds before it packages anything.
      - name: Publish to crates.io
        if: steps.released.outputs.on-registry != 'true'
        working-directory: sdks/rust
        env:
          # `CRATE_PUBLISH_TOKEN` is a secret of the `crates.io` environment above,
          # holding a registry token scoped to publish-update for BOTH crates —
          # the SDK and its derive, which this step uploads together. cargo reads
          # the token from `CARGO_REGISTRY_TOKEN`, so the mapping happens here.
          #
          # An environment secret is only visible to a job that names that
          # environment, so this token belongs to `crates.io` and not beside the
          # npm one.
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATE_PUBLISH_TOKEN }}
        run: cargo publish --allow-dirty

      # The tag names the commit this run built, for the reason given on
      # `publish-typescript`.
      - name: Create GitHub Release
        if: steps.released.outputs.tagged != 'true'
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          tag_name: ${{ needs.version.outputs.rust-version-tag }}
          target_commitish: ${{ github.sha }}
          name: Rust SDK ${{ needs.version.outputs.rust-version }}
          body_path: rust-changelog.md
          draft: false
          prerelease: ${{ contains(needs.version.outputs.rust-version, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
